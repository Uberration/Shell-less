# Milestone 2 acceptance program, with an explicit output.
agent:
  name: echoer

authority:
  - path: /tools/echo
    rights: [invoke]

  - path: /state/result
    rights: [write]

flow:
  - id: make_meat
    invoke:
      path: /tools/echo
      input:
        text: MEAT

  - id: store
    write:
      path: /state/result
      from: make_meat

outputs:
  result:
    from: store
