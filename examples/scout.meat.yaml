# Short forms, named references and subtree-scoped authority.
agent:
  name: scout

authority:
  - path: /memory/context
    rights: [read]
  - path: /tools/text
    rights: [invoke]
  - path: /state/scout
    rights: [write]

flow:
  - id: context
    read: /memory/context
  - invoke: /tools/text/upper
  - write: /state/scout/report
  - write:
      path: /state/scout/seen
      from: context
